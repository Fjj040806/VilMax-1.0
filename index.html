<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIilMx 1.0 · Live in the Movie</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101217;color:#f5f0e5}
body{max-width:1050px;margin:0 auto;padding:32px 20px}
header p,label,#status{color:#c1bdba} h1{font-size:clamp(2.5rem,7vw,5rem);margin:8px 0;letter-spacing:-.065em}
.eyebrow{color:#ffd28e;font:600 .85rem monospace;letter-spacing:.19em}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0}
button,select,.upload{font:inherit;color:#f5f0e5;background:#24262f;border:1px solid #69646a;border-radius:7px;padding:8px 12px}
button,.upload{cursor:pointer} input{accent-color:#ffbb6c}
canvas{display:block;width:100%;height:auto;border-radius:12px;background:#181a22}
#status{min-height:1.6em} footer{font-size:.9rem;color:#c1bdba}
</style>
</head>
<body>
<header><div class="eyebrow">VIilMx 1.0 / SOFTWARE VIEWFINDER</div><h1>Live in the Movie.</h1>
<p>Switch cinematic looks on a camera feed, video, or photo. Processing stays in this browser.</p></header>
<div class="controls">
<button id="camera">Start camera</button>
<label>Sample <select id="sample">
<option value="city">City street</option>
<option value="desk">Office desk</option>
<option value="bedroom">Bedroom</option>
<option value="synthetic">Synthetic street</option>
</select></label>
<button id="load-sample">Load sample</button>
<label class="upload">Open photo or video <input id="file" type="file" accept="image/*,video/*"></label>
<label>Look <select id="look"></select></label>
<label>Intensity <input id="intensity" type="range" min="0" max="100" value="100"></label>
<label><input id="adaptive" type="checkbox" checked> Adaptive exposure</label>
<label><input id="compare" type="checkbox" checked> Before / after</label>
</div>
<canvas id="preview" width="960" height="540" aria-label="Software viewfinder. Original on the left when comparison is enabled."></canvas>
<p id="status" role="status"></p>
<footer>Photo sources and credits are listed in the <a href="./docs/gallery.md">gallery</a>. Camera access requires localhost or HTTPS.</footer>
<script type="module" src="./viewfinder.js"></script>
</body>
</html>
